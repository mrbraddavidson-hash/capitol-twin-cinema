<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="100%" height="100%">
  <defs>
    <linearGradient id="star-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73" />
      <stop offset="50%" stop-color="#E2A624" />
      <stop offset="100%" stop-color="#9C6B0D" />
    </linearGradient>
    <linearGradient id="text-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDE69" />
      <stop offset="100%" stop-color="#F5A914" />
    </linearGradient>
    <linearGradient id="facet-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#C1121F" />
    </linearGradient>
    <linearGradient id="facet-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B7091B" />
      <stop offset="100%" stop-color="#780000" />
    </linearGradient>
    <linearGradient id="cyan-cell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8EDBE9" />
      <stop offset="100%" stop-color="#55B5C9" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <g id="single-film-wing">
      <path d="M 110,285 C 190,340 280,350 350,345 L 340,435 C 255,438 175,410 110,355 Z" fill="#181B1E" />
      <path d="M 125,302 C 162,323 186,331 202,335 L 197,414 C 178,409 157,398 125,370 Z" fill="url(#cyan-cell)" stroke="#181B1E" stroke-width="3" />
      <path d="M 218,338 C 255,344 278,346 298,347 L 293,425 C 273,424 251,422 213,416 Z" fill="url(#cyan-cell)" stroke="#181B1E" stroke-width="3" />
    </g>

    <linearGradient id="fb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171A" />
      <stop offset="50%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#181B1E" />
    </linearGradient>
    <radialGradient id="fb-spotlight" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E63946" stop-opacity="0.24" />
      <stop offset="50%" stop-color="#9C6B0D" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="312" fill="url(#fb-bg)" />
  <rect width="820" height="312" fill="url(#fb-spotlight)" />

  <!-- Top & Bottom Filmstrip Sprocket Accents -->
  <g fill="#2D333B">
    <rect x="0" y="0" width="820" height="14" fill="#14171A" stroke="url(#star-gold)" stroke-width="0.5" />
    <rect x="0" y="298" width="820" height="14" fill="#14171A" stroke="url(#star-gold)" stroke-width="0.5" />
  </g>
  <g fill="url(#cyan-cell)">
    <!-- Top sprockets -->
    <rect x="20" y="3" width="10" height="8" rx="1.5" /> <rect x="52" y="3" width="10" height="8" rx="1.5" /> <rect x="84" y="3" width="10" height="8" rx="1.5" /> <rect x="116" y="3" width="10" height="8" rx="1.5" /> <rect x="148" y="3" width="10" height="8" rx="1.5" /> <rect x="180" y="3" width="10" height="8" rx="1.5" /> <rect x="212" y="3" width="10" height="8" rx="1.5" /> <rect x="244" y="3" width="10" height="8" rx="1.5" /> <rect x="276" y="3" width="10" height="8" rx="1.5" /> <rect x="308" y="3" width="10" height="8" rx="1.5" /> <rect x="340" y="3" width="10" height="8" rx="1.5" /> <rect x="372" y="3" width="10" height="8" rx="1.5" /> <rect x="404" y="3" width="10" height="8" rx="1.5" /> <rect x="436" y="3" width="10" height="8" rx="1.5" /> <rect x="468" y="3" width="10" height="8" rx="1.5" /> <rect x="500" y="3" width="10" height="8" rx="1.5" /> <rect x="532" y="3" width="10" height="8" rx="1.5" /> <rect x="564" y="3" width="10" height="8" rx="1.5" /> <rect x="596" y="3" width="10" height="8" rx="1.5" /> <rect x="628" y="3" width="10" height="8" rx="1.5" /> <rect x="660" y="3" width="10" height="8" rx="1.5" /> <rect x="692" y="3" width="10" height="8" rx="1.5" /> <rect x="724" y="3" width="10" height="8" rx="1.5" /> <rect x="756" y="3" width="10" height="8" rx="1.5" /> <rect x="788" y="3" width="10" height="8" rx="1.5" />
    <!-- Bottom sprockets -->
    <rect x="20" y="301" width="10" height="8" rx="1.5" /> <rect x="52" y="301" width="10" height="8" rx="1.5" /> <rect x="84" y="301" width="10" height="8" rx="1.5" /> <rect x="116" y="301" width="10" height="8" rx="1.5" /> <rect x="148" y="301" width="10" height="8" rx="1.5" /> <rect x="180" y="301" width="10" height="8" rx="1.5" /> <rect x="212" y="301" width="10" height="8" rx="1.5" /> <rect x="244" y="301" width="10" height="8" rx="1.5" /> <rect x="276" y="301" width="10" height="8" rx="1.5" /> <rect x="308" y="301" width="10" height="8" rx="1.5" /> <rect x="340" y="301" width="10" height="8" rx="1.5" /> <rect x="372" y="301" width="10" height="8" rx="1.5" /> <rect x="404" y="301" width="10" height="8" rx="1.5" /> <rect x="436" y="301" width="10" height="8" rx="1.5" /> <rect x="468" y="301" width="10" height="8" rx="1.5" /> <rect x="500" y="301" width="10" height="8" rx="1.5" /> <rect x="532" y="301" width="10" height="8" rx="1.5" /> <rect x="564" y="301" width="10" height="8" rx="1.5" /> <rect x="596" y="301" width="10" height="8" rx="1.5" /> <rect x="628" y="301" width="10" height="8" rx="1.5" /> <rect x="660" y="301" width="10" height="8" rx="1.5" /> <rect x="692" y="301" width="10" height="8" rx="1.5" /> <rect x="724" y="301" width="10" height="8" rx="1.5" /> <rect x="756" y="301" width="10" height="8" rx="1.5" /> <rect x="788" y="301" width="10" height="8" rx="1.5" />
  </g>

  <!-- Left Column (Balanced 2-Line Architecture: CENTERED at x=150, y=156) -->
  <g transform="translate(150, 156)" text-anchor="middle">
    <!-- DOWNTOWN LISTOWEL: Even with BIG SCREEN • BIG SOUND -->
    <text x="0" y="-14" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="16.5" font-weight="900" letter-spacing="1.5" fill="url(#star-gold)">
      DOWNTOWN LISTOWEL
    </text>

    <!-- Centered Golden Divider Line -->
    <line x1="-55" y1="4" x2="55" y2="4" stroke="url(#star-gold)" stroke-width="1.8" />

    <!-- 120 WALLACE AVE. N.: Even with SMALL PRICES -->
    <text x="0" y="28" font-family="'Montserrat', 'Arial', sans-serif" font-size="15.5" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">
      120 WALLACE AVE. N.
    </text>
  </g>

  <!-- Center Hero: Primary Stack Emblem with EST. 1956 & PHONE NUMBER -->
  <g transform="translate(410, 136) scale(0.38) translate(-400, -400)" filter="url(#subtle-shadow)">
    <!-- Filmstrip Wings -->
    <use href="#single-film-wing" />
    <use href="#single-film-wing" transform="translate(800, 0) scale(-1, 1)" />

    <!-- Central Star -->
    <polygon points="400,135 440,258 570,258 465,335 505,458 400,382 295,458 335,335 230,258 360,258" fill="url(#star-gold)" stroke="#8A5B04" stroke-width="2" stroke-linejoin="round" />
    <g transform="translate(400, 312) scale(0.925) translate(-400, -312)">
      <polygon points="400,135 400,312 360,258" fill="url(#facet-light)" />
      <polygon points="400,135 440,258 400,312" fill="url(#facet-dark)" />
      <polygon points="570,258 400,312 440,258" fill="url(#facet-light)" />
      <polygon points="570,258 465,335 400,312" fill="url(#facet-dark)" />
      <polygon points="505,458 400,312 465,335" fill="url(#facet-light)" />
      <polygon points="505,458 400,382 400,312" fill="url(#facet-dark)" />
      <polygon points="295,458 400,312 400,382" fill="url(#facet-light)" />
      <polygon points="295,458 335,335 400,312" fill="url(#facet-dark)" />
      <polygon points="230,258 400,312 335,335" fill="url(#facet-light)" />
      <polygon points="230,258 360,258 400,312" fill="url(#facet-dark)" />
      <circle cx="400" cy="312" r="8" fill="url(#star-gold)" />
    </g>

    <!-- Typography -->
    <g text-anchor="middle">
      <text x="400" y="532" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="82" font-weight="900" letter-spacing="4" fill="url(#text-gold)" stroke="#14171A" stroke-width="4.5" paint-order="stroke fill">
        CAPITOL
      </text>
      <text x="400" y="592" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="34" font-weight="800" letter-spacing="10" fill="url(#text-gold)" stroke="#14171A" stroke-width="3" paint-order="stroke fill">
        TWIN CINEMA
      </text>

      <!-- EST. 1956 Plaque -->
      <g transform="translate(0, 612)">
        <path d="M 250,24 L 272,0 L 528,0 L 550,24 L 528,48 L 272,48 Z" fill="url(#star-gold)" stroke="#8A5B04" stroke-width="1.8" />
        <text x="400" y="32" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="23" font-weight="900" letter-spacing="4" fill="#14171A">
          EST. 1956
        </text>
      </g>
    </g>
  </g>

  <!-- PHONE NUMBER DIRECTLY UNDER EST. 1956 PLAQUE (Centered at x=410, y=262) -->
  <g transform="translate(410, 262)" text-anchor="middle">
    <text x="0" y="0" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="15.5" font-weight="900" letter-spacing="2.2" fill="url(#text-gold)">
      (519) 291-6000
    </text>
  </g>

  <!-- Right Column (Balanced 2-Line Architecture: CENTERED at x=670, y=156) -->
  <g transform="translate(670, 156)" text-anchor="middle">
    <!-- BIG SCREEN • BIG SOUND: Even with DOWNTOWN LISTOWEL -->
    <text x="0" y="-14" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="16" font-weight="900" letter-spacing="1.5" fill="url(#text-gold)">
      BIG SCREEN • BIG SOUND
    </text>

    <!-- Centered Cyan Divider Line -->
    <line x1="-55" y1="4" x2="55" y2="4" stroke="url(#cyan-cell)" stroke-width="1.8" />

    <!-- SMALL PRICES: Even with 120 WALLACE AVE. N. -->
    <text x="0" y="28" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="18" font-weight="900" letter-spacing="2.5" fill="#8EDBE9">
      SMALL PRICES
    </text>
  </g>
</svg>