<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
  <defs>
    
    <linearGradient id="star-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73" />
      <stop offset="50%" stop-color="#E2A624" />
      <stop offset="100%" stop-color="#9C6B0D" />
    </linearGradient>
    <linearGradient id="text-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDE69" />
      <stop offset="100%" stop-color="#F5A914" />
    </linearGradient>
    <linearGradient id="facet-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#C1121F" />
    </linearGradient>
    <linearGradient id="facet-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B7091B" />
      <stop offset="100%" stop-color="#780000" />
    </linearGradient>
    <linearGradient id="cyan-cell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8EDBE9" />
      <stop offset="100%" stop-color="#55B5C9" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <g id="single-film-wing">
      <path d="M 110,285 C 190,340 280,350 350,345 L 340,435 C 255,438 175,410 110,355 Z" fill="#181B1E" />
      <path d="M 125,302 C 162,323 186,331 202,335 L 197,414 C 178,409 157,398 125,370 Z" fill="url(#cyan-cell)" stroke="#181B1E" stroke-width="3" />
      <path d="M 218,338 C 255,344 278,346 298,347 L 293,425 C 273,424 251,422 213,416 Z" fill="url(#cyan-cell)" stroke="#181B1E" stroke-width="3" />
    </g>

  </defs>
  <g filter="url(#subtle-shadow)">
    <!-- Golden Chevron Plaque (from y=14 to y=236) -->
    <path d="M 15,125 L 50,14 L 550,14 L 585,125 L 550,236 L 50,236 Z" fill="#181B1E" stroke="url(#star-gold)" stroke-width="4" />
    <path d="M 28,125 L 58,26 L 542,26 L 572,125 L 542,224 L 58,224 Z" fill="none" stroke="url(#star-gold)" stroke-width="1.2" opacity="0.4" />
    
    <!-- Star Wings Mark: center y=82 -->
    <g transform="translate(300, 82)">
      
    <g transform="scale(0.28) translate(-400, -315)">
      <use href="#single-film-wing" />
      <use href="#single-film-wing" transform="translate(800, 0) scale(-1, 1)" />
      <polygon points="400,135 440,258 570,258 465,335 505,458 400,382 295,458 335,335 230,258 360,258" fill="url(#star-gold)" stroke="#8A5B04" stroke-width="2" />
      <g transform="translate(400, 312) scale(0.925) translate(-400, -312)">
        <polygon points="400,135 400,312 360,258" fill="url(#facet-light)" />
        <polygon points="400,135 440,258 400,312" fill="url(#facet-dark)" />
        <polygon points="570,258 400,312 440,258" fill="url(#facet-light)" />
        <polygon points="570,258 465,335 400,312" fill="url(#facet-dark)" />
        <polygon points="505,458 400,312 465,335" fill="url(#facet-light)" />
        <polygon points="505,458 400,382 400,312" fill="url(#facet-dark)" />
        <polygon points="295,458 400,312 400,382" fill="url(#facet-light)" />
        <polygon points="295,458 335,335 400,312" fill="url(#facet-dark)" />
        <polygon points="230,258 400,312 335,335" fill="url(#facet-light)" />
        <polygon points="230,258 360,258 400,312" fill="url(#facet-dark)" />
        <circle cx="400" cy="312" r="8" fill="url(#star-gold)" />
      </g>
    </g>
    
    </g>

    <!-- Main Title: y=156 -->
    <text x="300" y="156" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="36" font-weight="900" letter-spacing="2.5" fill="url(#text-gold)" stroke="#14171A" stroke-width="3" paint-order="stroke fill" text-anchor="middle">
      $5 CHEAP TUESDAYS
    </text>

    <!-- Subtitle: y=196 -->
    <text x="300" y="196" font-family="'Montserrat', 'Arial', sans-serif" font-size="12.5" font-weight="800" letter-spacing="2.5" fill="#FFFDF5" text-anchor="middle">
      ALL MOVIES • ALL SCREENS • EVERY WEEK
    </text>
  </g>
</svg>