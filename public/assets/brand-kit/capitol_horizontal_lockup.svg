<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow-h" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <linearGradient id="star-gold-h" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73" />
      <stop offset="50%" stop-color="#E2A624" />
      <stop offset="100%" stop-color="#9C6B0D" />
    </linearGradient>

    <linearGradient id="text-gold-h" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDE69" />
      <stop offset="100%" stop-color="#F5A914" />
    </linearGradient>

    <linearGradient id="facet-light-h" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#C1121F" />
    </linearGradient>
    <linearGradient id="facet-dark-h" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B7091B" />
      <stop offset="100%" stop-color="#780000" />
    </linearGradient>

    <linearGradient id="cyan-cell-h" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8EDBE9" />
      <stop offset="100%" stop-color="#55B5C9" />
    </linearGradient>

    <g id="single-film-wing-h">
      <path d="M 110,285 C 190,340 280,350 350,345 L 340,435 C 255,438 175,410 110,355 Z" fill="#181B1E" />
      <path d="M 125,302 C 162,323 186,331 202,335 L 197,414 C 178,409 157,398 125,370 Z" fill="url(#cyan-cell-h)" stroke="#181B1E" stroke-width="3" />
      <path d="M 218,338 C 255,344 278,346 298,347 L 293,425 C 273,424 251,422 213,416 Z" fill="url(#cyan-cell-h)" stroke="#181B1E" stroke-width="3" />
    </g>
  </defs>

  <g transform="translate(230, 200) scale(0.62) translate(-400, -315)">
    <g filter="url(#subtle-shadow-h)">
      <use href="#single-film-wing-h" />
      <use href="#single-film-wing-h" transform="translate(800, 0) scale(-1, 1)" />
    </g>

    <g filter="url(#subtle-shadow-h)">
      <polygon points="
        400,135 440,258 570,258 465,335 505,458
        400,382 295,458 335,335 230,258 360,258
      " fill="url(#star-gold-h)" stroke="#8A5B04" stroke-width="2" stroke-linejoin="round" />
      <g transform="translate(400, 312) scale(0.925) translate(-400, -312)">
        <polygon points="400,135 400,312 360,258" fill="url(#facet-light-h)" />
        <polygon points="400,135 440,258 400,312" fill="url(#facet-dark-h)" />
        <polygon points="570,258 400,312 440,258" fill="url(#facet-light-h)" />
        <polygon points="570,258 465,335 400,312" fill="url(#facet-dark-h)" />
        <polygon points="505,458 400,312 465,335" fill="url(#facet-light-h)" />
        <polygon points="505,458 400,382 400,312" fill="url(#facet-dark-h)" />
        <polygon points="295,458 400,312 400,382" fill="url(#facet-light-h)" />
        <polygon points="295,458 335,335 400,312" fill="url(#facet-dark-h)" />
        <polygon points="230,258 400,312 335,335" fill="url(#facet-light-h)" />
        <polygon points="230,258 360,258 400,312" fill="url(#facet-dark-h)" />
        <circle cx="400" cy="312" r="8" fill="url(#star-gold-h)" />
      </g>
    </g>
  </g>

  <!-- Typography Right Lockup: Bright Gold with Black Stroke -->
  <g transform="translate(470, 0)">
    <text x="0" y="160" font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" font-size="88" font-weight="900" letter-spacing="5" fill="url(#text-gold-h)" stroke="#14171A" stroke-width="4.5" paint-order="stroke fill">
      CAPITOL
    </text>
    <text x="5" y="235" font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="12" fill="url(#text-gold-h)" stroke="#14171A" stroke-width="3" paint-order="stroke fill">
      TWIN CINEMA
    </text>

    <g transform="translate(5, 265)">
      <path d="M 0,16 L 14,0 L 120,0 L 134,16 L 120,32 L 14,32 Z" fill="url(#star-gold-h)" />
      <text x="67" y="21" font-family="'Montserrat', 'Arial', sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#14171A" text-anchor="middle">
        EST. 1956
      </text>

      <text x="160" y="22" font-family="'Montserrat', 'Arial', sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#14171A">
        BIG SCREEN • BIG SOUND • SMALL PRICES
      </text>
    </g>
  </g>
</svg>