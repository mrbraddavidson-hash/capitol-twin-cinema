<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="mark-title mark-desc">
  <title id="mark-title">Capitol Twin Cinema mark</title>
  <desc id="mark-desc">A clean circular recreation of the Capitol Twin Cinema emblem with its red star, gold accents, black outlines, white field, and pale-blue screen.</desc>

  <circle cx="120" cy="120" r="110" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
  <circle cx="120" cy="120" r="105" fill="none" stroke="#F2AA3B" stroke-width="2"/>

  <!-- Red star with the gold edge from the original circle emblem. -->
  <path d="M120 28 136 70h45l-36 27 14 44-39-26-39 26 14-44-36-27h45Z" fill="#D83428" stroke="#000000" stroke-width="10" stroke-linejoin="round"/>
  <path d="M120 28 136 70h45l-36 27 14 44-39-26-39 26 14-44-36-27h45Z" fill="#D83428" stroke="#F2AA3B" stroke-width="6" stroke-linejoin="round"/>

  <!-- Film strip and blue screen. -->
  <path d="M44 105Q120 74 196 105L190 124Q120 94 50 124Z" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <path d="M52 122Q120 95 188 122L180 163Q120 140 60 163Z" fill="#E0F1F9" stroke="#000000" stroke-width="4"/>
  <path d="M83 111 77 153M120 101v48M157 111l6 42" fill="none" stroke="#000000" stroke-width="3"/>
  <g fill="#000000">
    <circle cx="59" cy="112" r="3"/><circle cx="76" cy="106" r="3"/><circle cx="94" cy="101" r="3"/>
    <circle cx="146" cy="101" r="3"/><circle cx="164" cy="106" r="3"/><circle cx="181" cy="112" r="3"/>
    <circle cx="61" cy="119" r="3"/><circle cx="78" cy="113" r="3"/><circle cx="96" cy="108" r="3"/>
    <circle cx="144" cy="108" r="3"/><circle cx="162" cy="113" r="3"/><circle cx="179" cy="119" r="3"/>
  </g>

  <text x="120" y="177" text-anchor="middle" fill="#000000" font-family="Arial,Helvetica,sans-serif" font-size="7" font-weight="900" letter-spacing=".2">BIG SCREEN. BIG SOUND. SMALL PRICES.</text>
  <text x="120" y="204" text-anchor="middle" textLength="148" lengthAdjust="spacingAndGlyphs" fill="#F2AA3B" stroke="#000000" stroke-width="1.25" paint-order="stroke" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="900" letter-spacing=".4">CAPITOL TWIN CINEMA</text>
</svg>
