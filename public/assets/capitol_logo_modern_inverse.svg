      <text x="120" y="204" text-anchor="middle" textLength="148" lengthAdjust="spacingAndGlyphs" fill="#F2AA3B" stroke="#000000" stroke-width="1.25" paint-order="stroke" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="900" letter-spacing=".4">CAPITOL TWIN CINEMA</text>
