<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Capitol Twin Cinema</title>
  <desc id="logo-desc">A clean modern dark-background lockup guided by the original Capitol Twin Cinema circle emblem, using its exact red, gold, black, white, and pale-blue colours.</desc>

